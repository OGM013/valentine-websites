<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day, Morayo!</title>
    <style>
        body {
            background-color: #ffccd5;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #d6336c;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 36px;
            margin-top: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 20px;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        /* Pop-up modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }

        .modal button {
            margin: 10px;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .yes-btn {
            background-color: #ff4d6d;
            color: white;
        }

        .no-btn {
            background-color: #ccc;
            color: black;
            position: absolute;
        }
    </style>
</head>
<body>

    <h1>Happy Valentine's Day, Morayo! ❤️</h1>
    
    <div class="container">
        <h2>Fill in your details, my love! 💕</h2>
        <form id="loveForm">
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" required placeholder="Enter your name"><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" required><br>

            <label for="state">State of Origin:</label><br>
            <input type="text" id="state" required placeholder="Enter your state"><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- Pop-up modal -->
    <div class="modal" id="loveModal">
        <h2>Do you love me, Morayo? ❤️</h2>
        <button class="yes-btn" onclick="redirectToLovePage()">Yes</button>
        <button class="no-btn" id="noButton">No</button>
    </div>

    <script>
        // Show the pop-up after form submission
        document.getElementById('loveForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('loveModal').style.display = 'block';
        });

        // Moving "No" button effect
        const noButton = document.getElementById('noButton');
        noButton.addEventListener('mouseover', function() {
            const randomX = Math.random() * 200 - 100; 
            const randomY = Math.random() * 200 - 100; 
            noButton.style.transform = `translate(${randomX}px, ${randomY}px)`;
        });

        // Redirect to love message page when "Yes" is clicked
        function redirectToLovePage() {
            window.location.href = "love.html";
        }
    </script>

</body>
</html>
