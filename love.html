<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You, Morayo! ❤️</title>
    <style>
        body {
            background-color: #ffccd5;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #d6336c;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 20%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .back-btn {
            background-color: #ff4d6d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            color: red;
            animation: floatUp 5s infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>I Love You So Much, Morayo! 💖💖</h1>
        <p>You are the most amazing person in my life, and I cherish every moment with you.  
           Happy Valentine's Day, my love! 💘</p>
        <button class="back-btn" onclick="goBack()">Go Back</button>
    </div>

    <script>
        // Floating hearts effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        setInterval(createHeart, 500);

        // Go back to main page
        function goBack() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
